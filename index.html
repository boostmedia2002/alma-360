<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>עלמה – סיבוב 360°</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f3f1ed;color:#222;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px;user-select:none;-webkit-user-select:none}
h1{font-size:20px;font-weight:600;letter-spacing:.3px}
.stage{position:relative;width:min(100%,520px);flex:1;min-height:0;max-height:82vh;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:#e9e6e0;touch-action:none}
.stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;transition:transform .15s;pointer-events:none;-webkit-user-drag:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.88);font-size:26px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2;display:flex;align-items:center;justify-content:center}
.arrow.l{left:10px}.arrow.r{right:10px}
.bar{display:flex;align-items:center;gap:10px}
.bar button{width:40px;height:40px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:20px;cursor:pointer}
.deg{min-width:70px;text-align:center;font-weight:600}
.hint{font-size:13px;color:#777}
</style>
</head>
<body oncontextmenu="return false">
<h1>עלמה – סיבוב 360°</h1>
<div class="stage" id="st">
  <button class="arrow l" id="prev" aria-label="שמאלה">‹</button>
  <img id="im" alt="עלמה">
  <button class="arrow r" id="next" aria-label="ימינה">›</button>
</div>
<div class="bar">
  <button id="zo" aria-label="הקטנה">−</button>
  <span class="deg" id="dg">0°</span>
  <button id="zi" aria-label="הגדלה">+</button>
</div>
<div class="hint">לחצו על החצים או החליקו כדי לסובב · + / − לזום</div>
<script>
const B="https://d2ol7oe51mr4n9.cloudfront.net/user_3KXs4GUTt01aKFgydxDk0mn9qU6/";
const F=["66c01066-6079-44c2-8dd1-158ac1c9a42e","ed6d4a26-6c97-4b24-aa90-3a415094562d","665d642c-0504-40a2-baaf-eb6827011d0b","cf9e463d-2d49-4a2f-9677-b1104dfba7ff","615867c1-f01c-46c5-a657-814a255d08d9","d4667a62-fc09-4473-a258-e5564fe2607b","c7fa9e05-901d-436b-86ec-2b9d3b7b5b98","ea0597df-37cf-4945-b06b-71272cd343c0"].map(i=>B+i+".jpg");
F.forEach(u=>{const p=new Image();p.src=u;});
const im=document.getElementById('im'),dg=document.getElementById('dg'),st=document.getElementById('st');
const Z=[1,1.5,2,3,4];let i=0,z=0,px=0,py=0;
function apply(){im.style.transform=`translate(${px}px,${py}px) scale(${Z[z]})`;}
function show(){im.src=F[i];dg.textContent=(i*45)+"°";}
function go(d){i=(i+d+F.length)%F.length;show();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('zi').onclick=()=>{if(z<Z.length-1){z++;apply();}};
document.getElementById('zo').onclick=()=>{if(z>0){z--;if(z==0){px=py=0;}apply();}};
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1);});
let sx=null,sy=null,ox=0,oy=0,moved=false;
st.addEventListener('pointerdown',e=>{if(e.target.tagName=='BUTTON')return;sx=e.clientX;sy=e.clientY;ox=px;oy=py;moved=false;st.setPointerCapture(e.pointerId);});
st.addEventListener('pointermove',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(z>0){px=ox+dx;py=oy+dy;im.style.transition='none';apply();}else if(Math.abs(dx)>40){go(dx<0?1:-1);sx=e.clientX;}});
st.addEventListener('pointerup',()=>{sx=null;im.style.transition='';});
show();apply();
</script>
</body>
</html>
